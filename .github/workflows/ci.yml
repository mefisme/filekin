# Secretless pull-request and main-branch validation. Third-party actions are
# pinned to immutable commit SHAs; Dependabot proposes reviewed updates.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test, and format (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Filekin.sln

      - name: Build
        run: dotnet build Filekin.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Filekin.sln --configuration Release --no-build --no-restore

      - name: Verify formatting
        run: dotnet format Filekin.sln --verify-no-changes --no-restore
