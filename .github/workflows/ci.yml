# Secretless pull-request and main-branch validation. Third-party actions are
# pinned to immutable commit SHAs; Dependabot proposes reviewed updates.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test, and format (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Filekin.sln

      - name: Build
        run: dotnet build Filekin.sln --configuration Release --no-restore

      # RequiresInteractiveShell covers tests that drive the real Windows Recycle Bin through
      # Shell.Application. A hosted runner has no interactive session, so a recycled file never
      # reaches the bin and the round trip cannot be verified. Those tests are expected to be run
      # on a developer desktop, where the full suite passes.
      - name: Test
        run: dotnet test Filekin.sln --configuration Release --no-build --no-restore --filter "TestCategory!=RequiresInteractiveShell"

      - name: Verify formatting
        run: dotnet format Filekin.sln --verify-no-changes --no-restore
